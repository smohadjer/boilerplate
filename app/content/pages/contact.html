<main>
  <div class="stage">
    <img class="responsive object-fit-cover"
      srcset="/assets/mobile/contact.webp 640w,
              /assets/contact.webp 1920w"
      sizes="100vw"
      src="/assets/mobile/contact.webp"
      width="1024"
      height="683"
      alt="" />
  </div>
  <article>
    <h1>Contact</h1>
    <form id="contact-form" method="post" action="/api/contact" accept-charset="UTF-8">
      <p>Fields marked with <strong>*</strong> are required.</p>
      <div class="honeypot" aria-hidden="true">
        <label for="company-website">Website</label>
        <input id="company-website" name="company_website" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <div class="row row--two-columns required">
        <label for="first_name">Name</label>
        <input id="first_name" name="first_name" required />
      </div>
       <div class="row row--two-columns">
        <label for="birthday">Date of birth</label>
        <input id="birthday" name="birthday" type="date" />
      </div>
       <div class="row row--two-columns required">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required />
      </div>
      <div class="row row--two-columns required">
        <label for="comments">Comment</label>
        <textarea id="comments" name="comments" rows="8" cols="50" required></textarea>
      </div>
      <div class="row required">
        <input type="checkbox" id="privacy" name="privacy" value="true" required />
        <label for="privacy">I agree with your <a href="privacy.html" target="_blank">privacy policy</a>.</label>
      </div>
      <p id="contact-form-error" class="form-error" role="alert" tabindex="-1" hidden></p>
      <button type="submit">Send</button>
    </form>
    <p id="contact-form-status" class="form-status" role="status" tabindex="-1" hidden></p>
  </article>
</main>
